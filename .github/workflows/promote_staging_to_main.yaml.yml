name: Promote staging to main
on:
  workflow_dispatch:

concurrency: promote

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Check fast-forward
        run: |
          if ! git merge-base --is-ancestor origin/main origin/staging; then
            echo "::error::main has commits that are not in staging. Sync main into dev and promote dev to staging first."
            exit 1
          fi

      - run: git push origin origin/staging:refs/heads/main